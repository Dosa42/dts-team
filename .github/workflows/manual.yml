name: Build Release and Debug APKs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant (both, release, or debug)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Licenses and Auto-Download
        run: |
          set -x
          ANDROID_SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_PATH" >> "$GITHUB_ENV"

          # Ensure runner user has write permissions for licenses and components
          sudo chown -R "$(whoami)" "$ANDROID_SDK_PATH" 2>/dev/null || true
          mkdir -p "$ANDROID_SDK_PATH/licenses" 2>/dev/null || sudo mkdir -p "$ANDROID_SDK_PATH/licenses"

          # Pre-seed Android SDK and NDK license agreements
          printf '%s\n' \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" | sudo tee "$ANDROID_SDK_PATH/licenses/android-sdk-license" > /dev/null

          printf '%s\n' \
            "84831b9409646a918e30573bab4c9c91346d8abd" | sudo tee "$ANDROID_SDK_PATH/licenses/android-sdk-preview-license" > /dev/null

          printf '%s\n' \
            "601085b94cd77f0b54ff86406957099fed792631" \
            "113668f445e453805e45261dd824f10791442620" \
            "e6b7c2ab7ff22c87c008dddc40c810fb4c94bd57" | sudo tee "$ANDROID_SDK_PATH/licenses/android-googletv-license" > /dev/null

          printf '%s\n' \
            "859f317696f67ef3d7f30a50a5560e7834b43903" | sudo tee "$ANDROID_SDK_PATH/licenses/android-sdk-arm-dbt-license" > /dev/null

          printf '%s\n' \
            "e9acab5b5fbb560a72cfa4e233b49ab87f2a6678" | sudo tee "$ANDROID_SDK_PATH/licenses/mips-android-sysimage-license" > /dev/null

          sudo chmod -R 777 "$ANDROID_SDK_PATH/licenses" 2>/dev/null || true
          echo "Android licenses successfully pre-seeded. Gradle auto-download will manage dependencies."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Environment File
        run: |
          set -x
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "NGROK_AUTHTOKEN=" > .env
            fi
          fi

      - name: Verify Samsung DeX MultiWindow SDK
        run: |
          set -x
          mkdir -p app/libs
          if [ ! -f app/libs/samsung-dex-sdk.jar ]; then
            echo "Generating self-contained Samsung DeX MultiWindow SDK fallback..."
            rm -rf /tmp/samsung_sdk
            mkdir -p /tmp/samsung_sdk/com/samsung/android/sdk/multiwindow \
                     /tmp/samsung_sdk/com/samsung/android/sdk/dex \
                     /tmp/samsung_sdk/android/content/res

            printf '%s\n' \
              'package android.content;' \
              'public class Context {}' > /tmp/samsung_sdk/android/content/Context.java

            printf '%s\n' \
              'package android.content.res;' \
              'public class Configuration {}' > /tmp/samsung_sdk/android/content/res/Configuration.java

            printf '%s\n' \
              'package com.samsung.android.sdk.multiwindow;' \
              'import android.content.Context;' \
              'public class SMultiWindow {' \
              '    public static final int FREEFORM = 1;' \
              '    public static final int SPLIT = 2;' \
              '    public void initialize(Context c) {}' \
              '    public boolean isFeatureEnabled(int f) { return true; }' \
              '}' > /tmp/samsung_sdk/com/samsung/android/sdk/multiwindow/SMultiWindow.java

            printf '%s\n' \
              'package com.samsung.android.sdk.dex;' \
              'import android.content.res.Configuration;' \
              'public class DexManager {' \
              '    public static boolean isDexMode(Configuration c) { return false; }' \
              '}' > /tmp/samsung_sdk/com/samsung/android/sdk/dex/DexManager.java

            javac -source 11 -target 11 \
              /tmp/samsung_sdk/android/content/Context.java \
              /tmp/samsung_sdk/android/content/res/Configuration.java \
              /tmp/samsung_sdk/com/samsung/android/sdk/multiwindow/SMultiWindow.java \
              /tmp/samsung_sdk/com/samsung/android/sdk/dex/DexManager.java

            jar cf app/libs/samsung-dex-sdk.jar -C /tmp/samsung_sdk com
            rm -rf /tmp/samsung_sdk
          fi
          ls -la app/libs/

      - name: Generate Build Keystores
        run: |
          set -x
          echo "Setting up signing keystores for CI..."
          # Setup release keystore
          if [ ! -f "${{ github.workspace }}/my-upload-key.jks" ]; then
            keytool -genkey -v \
              -keystore "${{ github.workspace }}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=CI, OU=Build, O=AIStudio, L=Cloud, S=Global, C=US"
          fi

          # Setup debug keystore required by debugConfig
          if [ ! -f "${{ github.workspace }}/debug.keystore" ]; then
            keytool -genkey -v \
              -keystore "${{ github.workspace }}/debug.keystore" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          set -x
          chmod +x gradlew
          BUILD_TYPE="${{ inputs.build_type || 'both' }}"
          echo "Executing Gradle build for mode: $BUILD_TYPE"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          elif [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          fi

      - name: Locate and Package APKs
        id: package_apks
        run: |
          set -x
          mkdir -p app/build/outputs/apk/packaged

          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" app/build/outputs/apk/packaged/ngrok-forwarder-debug.apk
            echo "Debug APK packaged: app/build/outputs/apk/packaged/ngrok-forwarder-debug.apk"
          fi

          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" app/build/outputs/apk/packaged/ngrok-forwarder-release.apk
            echo "Release APK packaged: app/build/outputs/apk/packaged/ngrok-forwarder-release.apk"
          fi

          ls -la app/build/outputs/apk/packaged/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ngrok-forwarder-apks
          path: app/build/outputs/apk/packaged/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/packaged/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
